# Certify skills/csv-summary and skills/pdf-extract with the public workrr certifier.
# Each certificate is signed keylessly via Sigstore and logged in public Rekor.
name: workrr-certify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  certify-csv-summary:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: workrr-trust/certify/.github/workflows/certify.yml@v0.1.3
    with:
      path: skills/csv-summary

  certify-pdf-extract:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: workrr-trust/certify/.github/workflows/certify.yml@v0.1.3
    with:
      path: skills/pdf-extract
